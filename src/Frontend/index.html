<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />

    <!-- Preconnect (تسريع تحميل الخط) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">

    <!-- Global CSS Layout Reset + hide prerendered HTML until the app is ready -->
    <style>
        html, body {
            background: #ffffff;
        }

        img, svg {
            max-width: 100%;
            height: auto;
        }

        /* Hide the prerendered HTML until React has mounted and styles are applied */
        #root:not(.app-ready) {
            opacity: 0;
        }

        #root {
            transition: opacity .25s ease;
        }

        /* Safety net: show the page after 4s even if JS fails */
        @keyframes show-root {
            to {
                opacity: 1;
            }
        }

        #root:not(.app-ready) {
            animation: show-root 0s 4s forwards;
        }

        /* Small loading spinner while the page is hidden */
        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            z-index: 9999;
        }

            #splash::after {
                content: '';
                width: 38px;
                height: 38px;
                border: 4px solid #e3eef7;
                border-top-color: #0865a8;
                border-radius: 50%;
                animation: splash-spin .8s linear infinite;
            }

        @keyframes splash-spin {
            to {
                transform: rotate(360deg);
            }
        }

        #root.app-ready ~ #splash {
            display: none;
        }
    </style>
    <noscript>
        <style>
            #root {
                opacity: 1 !important;
            }

            #splash {
                display: none;
            }
        </style>
    </noscript>

<body style="background-color: #ffffff;">

    <script>
                                        // @ts-nocheck
                                        function completeCallback(resultIndicator) {
                                            const win = window;
                                            if (win.completeCallbackReact) {
                                                win.completeCallbackReact(resultIndicator);
                                            }
                                        }
                                        function errorCallback(error) {
                                            const win = window;
                                            if (win.errorCallbackReact) {
                                                win.errorCallbackReact(error);
                                            }
                                        }
                                        function cancelCallback() {
                                            const win = window;
                                            if (win.cancelCallbackReact) {
                                                win.cancelCallbackReact();
                                            }
                                        }
    </script>
    <script src="https://banquemisr.gateway.mastercard.com/static/checkout/checkout.min.js"
            data-error="errorCallback"
            data-cancel="cancelCallback"
            data-complete="completeCallback">
