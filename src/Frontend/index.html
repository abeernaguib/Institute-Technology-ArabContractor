<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />

    <script>
                // Runs before the first paint.
                document.documentElement.classList.add('js-loading');

                // Reveal helper: main.jsx calls this after React has painted with its styles.
                window.__revealApp = function () {
                    document.documentElement.classList.remove('js-loading');
                };

                // Last-resort safety net only (e.g. JS failed to load). Normal reveal is from main.jsx.
                setTimeout(window.__revealApp, 20000);
    </script>

    <style>
        html, body {
            background: #ffffff;
        }

        img, svg {
            max-width: 100%;
            height: auto;
        }

        /* Even if the JS styles are late, icons and the logo can never blow up */
        .MuiSvgIcon-root {
            width: 1em;
            height: 1em;
            font-size: 1.5rem;
        }

        img.nav-logo {
            height: 62px;
            width: auto;
        }

        /* Hide the page while it is loading */
        #root {
            transition: opacity .25s ease;
        }

        html.js-loading #root {
            opacity: 0;
        }

        /* Spinner, shown only while loading */
        #splash {
            display: none;
        }

        html.js-loading #splash {
            display: flex;
            position: fixed;
            inset: 0;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            z-index: 9999;
        }

            html.js-loading #splash::after {
                content: '';
                width: 38px;
                height: 38px;
                border: 4px solid #e3eef7;
                border-top-color: #0865a8;
                border-radius: 50%;
                animation: splash-spin .8s linear infinite;
            }

        @keyframes splash-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <noscript>
        <style>
            html.js-loading #root {
                opacity: 1;
            }

            html.js-loading #splash {
                display: none;
            }
        </style>
    </noscript>

<body style="background-color: #ffffff;">

    <script>
                // @ts-nocheck
                function completeCallback(resultIndicator) {
                    if (window.completeCallbackReact) window.completeCallbackReact(resultIndicator);
                }
                function errorCallback(error) {
                    if (window.errorCallbackReact) window.errorCallbackReact(error);
                }
                function cancelCallback() {
                    if (window.cancelCallbackReact) window.cancelCallbackReact();
                }
    </script>

    <!-- async: no longer blocks the page or delays main.jsx -->
    <script async
            src="https://banquemisr.gateway.mastercard.com/static/checkout/checkout.min.js"
            data-error="errorCallback"
            data-cancel="cancelCallback"
            data-complete="completeCallback">
    </script>
