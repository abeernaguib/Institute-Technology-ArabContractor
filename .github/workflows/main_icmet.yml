name: Build and deploy ASP+React to Azure Web App - icmet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore src/Backend/Institute.Web/Institute.Web.sln

      - name: Build backend solution
        run: msbuild src/Backend/Institute.Web/Institute.Web.sln /p:Configuration=Release

      - name: Build and publish backend API
        run: dotnet publish src/Backend/Institute.Web/Institute.API/Institute.API.csproj -c Release -o published

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          cd src/Frontend
          npm ci

      - name: Create .env file for frontend
        shell: pwsh
        run: |
          $envContent = @"
          VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          "@
          $envContent.Trim() | Out-File -FilePath "src/Frontend/.env" -Encoding utf8
          Write-Host "Frontend .env file created"

      - name: Build frontend
        shell: pwsh
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          cd src/Frontend
          npm run build

      - name: Copy React dist to wwwroot
        shell: pwsh
        run: |
          if (!(Test-Path "published/wwwroot")) {
            New-Item -ItemType Directory -Path "published/wwwroot" | Out-Null
          }

          Copy-Item `
            -Path src/Frontend/dist/* `
            -Destination published/wwwroot `
            -Recurse `
            -Force

      - name: Remove web.config from wwwroot if present
        shell: pwsh
        run: |
          $dest = "published/wwwroot/web.config"

          if (Test-Path $dest) {
            Remove-Item -Path $dest -Force
            Write-Host "Removed web.config from wwwroot"
          }
          else {
            Write-Host "No web.config in wwwroot - nothing to remove"
          }

      - name: Verify React index.html
        shell: pwsh
        run: |
          if (Test-Path "published/wwwroot/index.html") {
            Write-Host "SUCCESS: published/wwwroot/index.html exists."
          }
          else {
            Write-Error "ERROR: published/wwwroot/index.html was not found."
            exit 1
          }

      - name: Show publish folder contents
        shell: pwsh
        run: |
          Get-ChildItem -Path published -Recurse

      - name: Verify publish folder
        shell: pwsh
        run: |
          $files = Get-ChildItem published -Recurse

          if ($files.Count -eq 0) {
            Write-Error "ERROR: Publish folder is empty!"
            exit 1
          }
          else {
            Write-Host "Publish folder contains files:"
            $files
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: published/
          retention-days: 1

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    env:
      RESOURCE_GROUP: RG-Website-App
      APP_NAME: icmet
      RULE_NAME: GitHubRunner-${{ github.run_id }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: artifact

      - name: Verify downloaded artifact
        shell: pwsh
        run: |
          $files = Get-ChildItem artifact -Recurse

          if ($files.Count -eq 0) {
            Write-Error "ERROR: Artifact folder is empty!"
            exit 1
          }
          else {
            Write-Host "Artifact downloaded successfully."
            $files
          }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3425383CFDD642EDA82861804329F239 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_28BAC65785F849618D391DD4B3AEC846 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6FD5AC0498743EB9EA4B66A46679582 }}

      # 1. Get the public IP of this GitHub runner
      - name: Get GitHub Runner IP
        id: get_ip
        shell: pwsh
        run: |
          $ip = (Invoke-RestMethod -Uri "https://api.ipify.org").Trim()
          "RUNNER_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Runner IP: $ip"

      # 2. Whitelist the runner IP on the SCM (Kudu) site and the main site
      - name: Whitelist Runner IP on SCM & Main Site
        uses: azure/powershell@v2
        with:
          azPSVersion: "latest"
          inlineScript: |
            # Rule on the SCM (Kudu) site - required for deployment
            Add-AzWebAppAccessRestrictionRule `
              -ResourceGroupName "$env:RESOURCE_GROUP" `
              -WebAppName "$env:APP_NAME" `
              -Name "$env:RULE_NAME" `
              -Priority 100 `
              -Action Allow `
              -IpAddress "$($env:RUNNER_IP)/32" `
              -TargetScm `
              -IgnoreMissingVnetServiceEndpoint

            # Rule on the main web app site
            Add-AzWebAppAccessRestrictionRule `
              -ResourceGroupName "$env:RESOURCE_GROUP" `
              -WebAppName "$env:APP_NAME" `
              -Name "$env:RULE_NAME" `
              -Priority 100 `
              -Action Allow `
              -IpAddress "$($env:RUNNER_IP)/32" `
              -IgnoreMissingEndpoint

      # 3. Give the rules time to take effect
      - name: Wait for rule propagation
        shell: pwsh
        run: Start-Sleep -Seconds 30

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: icmet
          slot-name: Production
          package: artifact/

      # 4. Cleanup: remove the rules (runs even if a previous step failed)
      - name: Remove Whitelisted IP
        if: always()
        uses: azure/powershell@v2
        with:
          azPSVersion: "latest"
          inlineScript: |
            Remove-AzWebAppAccessRestrictionRule `
              -ResourceGroupName "$env:RESOURCE_GROUP" `
              -WebAppName "$env:APP_NAME" `
              -Name "$env:RULE_NAME" `
              -TargetScm `
              -ErrorAction SilentlyContinue

            Remove-AzWebAppAccessRestrictionRule `
              -ResourceGroupName "$env:RESOURCE_GROUP" `
              -WebAppName "$env:APP_NAME" `
              -Name "$env:RULE_NAME" `
              -ErrorAction SilentlyContinue
