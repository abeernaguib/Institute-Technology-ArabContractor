name: Build and deploy ASP+React to Azure Web App - icmet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore src/Backend/Institute.Web/Institute.Web.sln

      - name: Build backend solution
        run: msbuild src/Backend/Institute.Web/Institute.Web.sln /p:Configuration=Release

      - name: Build and publish backend API
        run: dotnet publish src/Backend/Institute.Web/Institute.API/Institute.API.csproj -c Release -o published

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          cd src/Frontend
          npm ci

      - name: Create .env file for frontend
        shell: pwsh
        run: |
          $envContent = @"
          VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          "@
          $envContent.Trim() | Out-File -FilePath "src/Frontend/.env" -Encoding utf8
          Write-Host "Frontend .env file created"

      - name: Build frontend
        shell: pwsh
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          cd src/Frontend
          npm run build

      - name: Copy React dist to wwwroot
        shell: pwsh
        run: |
          if (!(Test-Path "published/wwwroot")) {
            New-Item -ItemType Directory -Path "published/wwwroot" | Out-Null
          }

          Copy-Item `
            -Path src/Frontend/dist/* `
            -Destination published/wwwroot `
            -Recurse `
            -Force

      - name: Remove web.config from wwwroot if present
        shell: pwsh
        run: |
          $dest = "published/wwwroot/web.config"

          if (Test-Path $dest) {
            Remove-Item -Path $dest -Force
            Write-Host "Removed web.config from wwwroot"
          }
          else {
            Write-Host "No web.config in wwwroot - nothing to remove"
          }

      - name: Verify React index.html
        shell: pwsh
        run: |
          if (Test-Path "published/wwwroot/index.html") {
            Write-Host "SUCCESS: published/wwwroot/index.html exists."
          }
          else {
            Write-Error "ERROR: published/wwwroot/index.html was not found."
            exit 1
          }

      - name: Show publish folder contents
        shell: pwsh
        run: |
          Get-ChildItem -Path published -Recurse

      - name: Verify publish folder
        shell: pwsh
        run: |
          $files = Get-ChildItem published -Recurse

          if ($files.Count -eq 0) {
            Write-Error "ERROR: Publish folder is empty!"
            exit 1
          }
          else {
            Write-Host "Publish folder contains files:"
            $files
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: published/
          retention-days: 1

  deploy:
    # azure/cli@v2 is a Docker-based action and only runs on Linux runners
    runs-on: ubuntu-latest
    needs: build

    # Prevent two deploys from competing for the same rule priority
    concurrency:
      group: deploy-icmet
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    env:
      RESOURCE_GROUP: RG-Website-App
      APP_NAME: icmet
      RULE_NAME: GitHubRunner-${{ github.run_id }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: artifact

      - name: Verify downloaded artifact
        shell: pwsh
        run: |
          $files = Get-ChildItem artifact -Recurse

          if ($files.Count -eq 0) {
            Write-Error "ERROR: Artifact folder is empty!"
            exit 1
          }
          else {
            Write-Host "Artifact downloaded successfully."
            $files
          }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3425383CFDD642EDA82861804329F239 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_28BAC65785F849618D391DD4B3AEC846 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6FD5AC0498743EB9EA4B66A46679582 }}

      # 1. Get GitHub Runner public IP
      - name: Get GitHub Runner IP
        id: get_ip
        run: |
          IP=$(curl -s https://api.ipify.org)
          if [ -z "$IP" ]; then
            echo "Failed to determine runner IP"
            exit 1
          fi
          echo "Runner IP: $IP"
          echo "RUNNER_IP=$IP" >> $GITHUB_ENV

      # 2. Whitelist runner IP on the SCM (Kudu) site ONLY.
      #    The main site (behind the WAF) is intentionally NOT opened.
      #    Priority must be LOWER than the "Deny All" rule (priority 5),
      #    otherwise the Deny rule matches first. Existing SCM rules:
      #    0 = Allow Adly, 5 = Deny All  ->  free slots are 1-4.
      #    NOTE: the deploy service principal needs
      #    Microsoft.Network/virtualNetworks/subnets/joinViaServiceEndpoint/action
      #    on the VNet subnet referenced by the main site access restrictions.
      - name: Whitelist Runner IP on SCM site
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config access-restriction add \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --rule-name "$RULE_NAME" \
              --action Allow \
              --ip-address "${RUNNER_IP}/32" \
              --priority 2 \
              --scm-site true

      # 3. Wait until Kudu is reachable (instead of a fixed sleep)
      - name: Wait for rule propagation
        run: |
          URL="https://${APP_NAME}.scm.azurewebsites.net/"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" != "403" ] && [ "$CODE" != "000" ]; then
              echo "SCM site is reachable."
              exit 0
            fi
            sleep 15
          done
          echo "SCM site still not reachable after waiting."
          exit 1

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: icmet
          slot-name: Production
          package: artifact/

      # 4. Cleanup: always runs, removes the rule if it exists, fails loudly on error
      - name: Remove Whitelisted IP
        if: always()
        uses: azure/cli@v2
        with:
          inlineScript: |
            EXISTS=$(az webapp config access-restriction show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --query "scmIpSecurityRestrictions[?name=='$RULE_NAME'] | length(@)" \
              -o tsv)

            if [ "$EXISTS" != "0" ]; then
              echo "Removing SCM rule $RULE_NAME"
              az webapp config access-restriction remove \
                --resource-group "$RESOURCE_GROUP" \
                --name "$APP_NAME" \
                --rule-name "$RULE_NAME" \
                --scm-site true
            else
              echo "Rule $RULE_NAME not present - nothing to remove"
            fi
